<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certification Practice</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='18' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3E✓%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
  </head>
  <body>
    <!-- Auth Header -->
    <header id="auth-header" class="auth-header hidden">
      <span id="auth-user-email" class="auth-email"></span>
      <button
        id="auth-logout-btn"
        class="btn btn-sm btn-secondary"
        onclick="handleLogout()"
      >
        Sign Out
      </button>
    </header>

    <div id="app">
      <!-- Breadcrumb -->
      <nav
        id="breadcrumb"
        class="breadcrumb hidden"
        aria-label="Breadcrumb"
      ></nav>

      <!-- Auth View -->
      <main id="view-auth" class="view hidden">
        <div class="auth-container">
          <h1 class="page-title">Sign In</h1>
          <p class="page-subtitle">
            Sign in to sync your progress across devices
          </p>
          <form id="auth-form" onsubmit="handleAuthSubmit(event)">
            <div class="form-group">
              <label for="auth-email">Email</label>
              <input
                type="email"
                id="auth-email"
                required
                autocomplete="email"
              />
            </div>
            <div class="form-group">
              <label for="auth-password">Password</label>
              <input
                type="password"
                id="auth-password"
                required
                autocomplete="current-password"
                minlength="6"
              />
            </div>
            <div id="auth-error" class="auth-error hidden"></div>
            <div class="auth-actions">
              <button
                type="submit"
                class="btn btn-primary"
                id="auth-submit-btn"
              >
                Sign In
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                id="auth-toggle-btn"
                onclick="toggleAuthMode()"
              >
                Create Account
              </button>
            </div>
          </form>
          <div class="auth-footer-links">
            <button class="btn btn-link" onclick="handleForgotPassword()">
              Forgot password?
            </button>
            <button class="btn btn-link" onclick="skipAuth()">
              Continue without signing in
            </button>
          </div>
        </div>
      </main>

      <!-- Views -->
      <main id="view-home" class="view"></main>
      <main id="view-topic" class="view hidden"></main>
      <main id="view-tests" class="view hidden"></main>
      <main id="view-exam" class="view hidden"></main>
      <main id="view-report" class="view hidden"></main>
      <main id="view-history" class="view hidden"></main>
    </div>

    <!-- Firebase SDK (script tag approach — no build step needed) -->
    <script type="module" src="firebase-init.js"></script>
    <script src="app.js"></script>
  </body>
</html>
